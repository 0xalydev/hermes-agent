name: Workflow syntax

# The one check that cannot live inside ci.yaml.
#
# `24f5a60` ("fix: re-disable e2e") left a `${{` unclosed on ci.yaml:126 and
# every CI run in the repository failed at parse time (#100748). The pull
# request that shipped it was green: GitHub does not create a run for a
# workflow file it cannot parse, so the `CI` check did not go red — it
# stopped existing, and there was nothing pending for a required-check gate
# to block on. Only the *other* pull requests, which inherit the broken file
# from main, ever see the failure.
#
# Thirty-one of the thirty-two workflow files are `workflow_call` targets
# that ci.yaml invokes, so none of them run when ci.yaml is unparseable and
# none of them can police it. This workflow therefore owns its trigger, the
# same reason docker.yml and nix.yml own theirs.
#
# It runs on every pull request rather than behind a `paths:` filter so it
# can be a required status check without the skipped-and-stuck-pending trap.
#
# The check itself is actionlint (rhysd/actionlint), which carries a real
# port of GitHub's expression parser. A substring scan for `${{`/`}}` cannot
# do this job: `${{ false && (a == b }}`, `${{ format('}}') }}` and
# `${{ github.ref == }}` each have balanced braces, each is rejected by
# GitHub's parser, and each passed the substring checker this file first
# shipped with. actionlint also resolves every local `uses:
# ./.github/actions/<name>` and fails when that action.yml does not parse
# or the caller passes an input the action does not declare.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflow-syntax-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-workflow-syntax:
    name: Workflow files parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download actionlint
        env:
          # Bump both together. Checksum is the linux_amd64 line of
          # https://github.com/rhysd/actionlint/releases/download/v<ver>/actionlint_<ver>_checksums.txt
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP/actionlint" actionlint
          chmod 0755 "$RUNNER_TEMP/actionlint/actionlint"
          rm actionlint.tar.gz
          "$RUNNER_TEMP/actionlint/actionlint" -version

      - name: Reject unparseable workflow files
        # Syntax and expression checking only: shellcheck and pyflakes are
        # separate concerns with their own backlog, and this gate must stay
        # a pure "would GitHub dispatch this?" answer so it can be required.
        # Config (runner labels, ignores): .github/actionlint.yaml
        run: |
          "$RUNNER_TEMP/actionlint/actionlint" -color=false -shellcheck= -pyflakes=

      - name: Every composite action is reachable by the lint
        # actionlint only opens an action.yml when a workflow references it
        # via `uses: ./.github/actions/<name>`. An action nobody references
        # is dead code and would also be unchecked; fail loudly instead of
        # silently letting it rot.
        run: |
          set -euo pipefail
          status=0
          for meta in .github/actions/*/action.yml .github/actions/*/action.yaml; do
            [ -e "$meta" ] || continue
            dir=$(dirname "$meta")
            if ! grep -rqF -- "uses: ./$dir" .github/workflows/; then
              echo "::error file=$meta::no workflow references '$dir'; actionlint never parsed it. Reference it or delete it."
              status=1
            fi
          done
          exit "$status"
