# TEMPORARY - Windows live smoke for PR #96726 (Bot Mode rewrite).
# Exists ONLY on the wine2e/96726-botmode-smoke proof branch; never merges.
# Trigger: push to this branch only (never pull_request - 2x-cost runners).
name: 96726 Bot Mode Windows smoke

on:
  push:
    branches:
      - "wine2e/96726-botmode-smoke"

permissions:
  contents: read

concurrency:
  group: botmode-win-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win-smoke:
    name: Bot Mode live smoke (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      E2E_EVIDENCE_DIR: ${{ github.workspace }}\win-smoke-evidence
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install backend dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install workspace dependencies
        shell: bash
        run: npm ci

      - name: Build desktop (renderer + electron bundle)
        shell: bash
        working-directory: apps/desktop
        run: npm run build

      - name: Prepare scratch HERMES_HOME
        shell: bash
        run: |
          set -euo pipefail
          HH="${RUNNER_TEMP}/hermes-home"
          mkdir -p "$HH/profiles" "$HH/logs"
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            printf 'model:\n  provider: openrouter\n  default: anthropic/claude-sonnet-4\n' > "$HH/config.yaml"
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" > "$HH/.env"
            echo "E2E_HAS_KEY=1" >> "$GITHUB_ENV"
          else
            printf 'model:\n  provider: openrouter\n  default: anthropic/claude-sonnet-4\n' > "$HH/config.yaml"
            : > "$HH/.env"
            echo "E2E_HAS_KEY=0" >> "$GITHUB_ENV"
          fi
          echo "HERMES_HOME=$HH" >> "$GITHUB_ENV"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run Bot Mode Windows smoke driver
        shell: bash
        working-directory: apps/desktop
        run: |
          set -uo pipefail
          # venv on PATH so the electron main process spawns the real backend
          export PATH="${GITHUB_WORKSPACE}/.venv/Scripts:${PATH}"
          export VIRTUAL_ENV="${GITHUB_WORKSPACE}/.venv"
          node e2e-win-botmode.cjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-smoke-evidence
          path: |
            win-smoke-evidence/
            ${{ runner.temp }}/hermes-home/logs/
          if-no-files-found: warn
          retention-days: 7
